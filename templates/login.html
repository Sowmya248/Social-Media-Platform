<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - SocialMedia</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body class="auth-body">


<div class="auth-container">

    <div class="auth-card">

        <h1>SocialMedia</h1>

        <h2>Login</h2>

        <p>Welcome back!</p>


        <form id="loginForm">


            <input
                type="text"
                id="loginUsername"
                placeholder="Username"
                required>


            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                required>


            <button type="submit">
                Login
            </button>


        </form>


        <p id="loginMessage"></p>


        <p>
            Don't have an account?
            <a href="{{ url_for('signup') }}">
                Create Account
            </a>
        </p>


        <p>
            <a href="{{ url_for('admin_login') }}">
                Admin Login
            </a>
        </p>


    </div>

</div>


<script src="{{ url_for('static', filename='js/script.js') }}">
</script>

</body>

</html>
