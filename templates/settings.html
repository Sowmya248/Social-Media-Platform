<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Settings</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>


<nav class="navbar">

    <div class="logo">
        SocialMedia
    </div>

    <div class="nav-links">

        <a href="{{ url_for('home') }}">Home</a>

        <a href="{{ url_for('profile') }}">Profile</a>

        <button id="logoutButton"
                class="logout-btn">
            Logout
        </button>

    </div>

</nav>


<main class="page-container">

    <h1>⚙️ Settings</h1>


    <div class="feature-card">

        <h2>Account Settings</h2>


        <label>
            Username
        </label>

        <input
            type="text"
            id="settingsUsername"
            readonly>


        <label>
            Theme
        </label>

        <select>

            <option>
                Light
            </option>

            <option>
                Dark
            </option>

        </select>


        <button>
            Save Settings
        </button>

    </div>


</main>


<script src="{{ url_for('static', filename='js/script.js') }}">
</script>

</body>

</html>
